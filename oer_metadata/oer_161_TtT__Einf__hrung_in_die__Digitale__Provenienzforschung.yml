name: 'TtT: Einführung in die (Digitale) Provenienzforschung'
description: >-
  Dieses Train-the-Trainer-Material (TtT) ist für Dozierende gedacht, die einen
  grundlegenden Einstieg in Begriffe, Entzugskontexte und methodische Ansätze
  sowie in digitale Recherche- und Dokumentationspraktiken vermitteln wollen. Es
  umfasst Präsentationsfolien sowie ein Drehbuch zum Ablauf eines ca. 180
  minütigen Online-Workshops.Die Zielgruppe für den Workshop sind
  Einsteiger*innen und Personen ohne Vorkenntnisse, die sich erstmals mit
  (Digitaler) Provenienzforschung beschäftigen.Die Folien und das Drehbuch zum
  Kurs finden Sie hier: https://doi.org/10.5281/zenodo.19232605 InhaltThemenblock
  1 – Grundlagen der Provenienzforschung: Teilnehmer*innen erhalten eine
  Einführung in zentrale Definitionen und historische Zusammenhänge. Behandelt
  werden u.a. Definitionen (Digitaler) Provenienzforschung, von Besitz und
  Eigentum, Kulturgut, sowie ein Einstieg in die historisch-rechtlich-ethischen
  Rahmenbedingungen z.B. die Washingtoner Prinzipien.Themenblock 2 – Recherche
  von Provenienzinformationen: Im Fokus stehen Strategien zur Identifikation
  verschiedener Entzugskontexte (NS, SBZ/DDR, Koloniale Kontexte). Darüber hinaus
  erfolgt ein Einblick in einige Recherchedatenbanken und Tools.Themenblock 3 –
  Strukturierung von Provenienzangaben: Es erfolgt eine Einführung in die
  Relevanz einer standardisierten Erfassung von Provenienzdaten. Zudem werden
  verschiedene Beispiele für Metadatenschemata gezeigt und gemeinsam
  diskutiert.MaterialienThemenblock 2Gruppenübung und Ergebnisse zu den
  Entzugskontexten: https://miro.com/app/board/uXjVGFkUzuU=/ Entzugskontexte
  erkennen: NS-verfolgungsbedingt entzogenes Kulturgut.
  https://doi.org/10.5281/zenodo.19237137  Entzugskontexte erkennen: Sowjetische
  Besatzungszone und DDR. https://doi.org/10.5281/zenodo.19237620 Entzugskontexte
  erkennen: Koloniale Kontexte. https://doi.org/10.5281/zenodo.21158166
  Themenblock 3Tabellenvorlage für eine Übung zur strukturierten Erfassung von
  Provenienzketten:
  https://docs.google.com/spreadsheets/d/14D1vQUDafm60izKozyULZW2wVIoEgHxBziyItVZ7mZo/edit?usp=sharing
