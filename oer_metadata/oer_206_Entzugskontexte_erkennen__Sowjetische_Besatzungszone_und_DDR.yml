name: 'Entzugskontexte erkennen: Sowjetische Besatzungszone und DDR'
description: >-
  Wie erkenne ich, ob ein Objekt in der Sammlung unrechtmäßig entzogen wurde?
  Welche Objekte können betroffen sein? Welche Hinweise befinden sich auf den
  Objekten? Wie kam das Objekt in die Sammlung und wem gehörte das Objekt, bevor
  es in die Sammlung kam? Diese Quick Access Resource bietet tabellarisch und
  stichpunktartig einen Überblick zum Einstieg in die Provenienzforschung im
  Bereich Sowjetische Besatzungszone und DDR. Sie ist zum selbstständigen
  Einstieg in das Thema geeignet, ebenso als Begleitmaterial oder Handout für
  Workshops und Seminare.  Zöllner, G.&amp; Reichert, R. (2026). Entzugskontexte
