type: LearningResource
name: 'Selbstlernkurs: Einführung (Digitale) Provenienzforschung'
description: >-
  Planen Sie, die Herkunft der Objekte in Ihrer Sammlung zu erforschen? Brauchen
  Sie dafür einen Einstieg in das das Feld der (digitalen) Provenienzforschung
  – von methodischen Grundlagen der Provenienzforschung über die Nutzung
  digitaler Ressourcen und Tools bis hin zur Erfassung von
  Provenienzangaben?Dieser Online-Kurs richtet sich an Einsteiger*innen und
  Personen ohne Vorkenntnisse, die sich erstmals mit (Digitaler)
  Provenienzforschung beschäftigen. Er vermittelt einen grundlegenden Einstieg in
  Begriffe, Entzugskontexte und methodische Ansätze sowie in digitale Recherche-
  und Dokumentationspraktiken.Themenblock 1 – Grundlagen der
  Provenienzforschung: Teilnehmer*innen erhalten eine Einführung in zentrale
  Definitionen und historische Zusammenhänge. Behandelt werden u.a. Definitionen
  (Digitaler) Provenienzforschung, von Besitz und Eigentum, Kulturgut, sowie ein
  Einstieg in die historisch-rechtlich-ethischen Rahmenbedingungen z.B. die
  Washingtoner Prinzipien.Themenblock 2 – Recherche von Provenienzinformationen:
  Im Fokus stehen Strategien zur Identifikation verschiedener Entzugskontexte (NS,
  SBZ/DDR, Koloniale Kontexte). Darüber hinaus erfolgt ein Einblick in einige
  Recherchedatenbanken und Tools.Themenblock 3 – Strukturierung von
  Provenienzangaben: Es erfolgt eine Einführung in die Relevanz einer
  standardisierten Erfassung von Provenienzdaten. Zudem werden verschiedene
  Beispiele für Metadatenschemata gezeigt und gemeinsam diskutiert.
