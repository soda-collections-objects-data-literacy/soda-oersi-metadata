name: 'Entzugskontexte erkennen: NS-verfolgungsbedingt entzogenes Kulturgut'
description: >-
  Wie erkenne ich, ob ein Objekt in einer Sammlung unrechtmäßig entzogen wurde?
  Welche Objekte können betroffen sein? Welche Hinweise befinden sich auf den
  Objekten? Wie kam das Objekt in die Sammlung und wem gehörte es, bevor es in
  die Sammlung kam? Diese Quick Access Resources bietet tabellarisch und
  stichpunktartig einen Überblick zum Einstieg in die Provenienzforschung im
  Bereich des NS-verfolgungsbedingt entzogenen Kulturguts. Sie ist zum
  selbstständigen Einarbeiten in das Thema geeignet, ebenso als Begleitmaterial
  oder Handout für Workshops und Seminare. Zöllner, G.&amp; Reichert, R. (2026).
