name: 'Selbstlernkurs zu Basiskurs Modul 6: Ethische Herausforderungen'
description: >-
  Bei der der Digitalisierung universitärer Sammlungen können verschiedene
  ethischer Herausforderungen auftauchen, z.B. Objekte aus Unrechtskontexten,
  Objekte mit menschlichen Überresten, Objekte aus indigenen Communities oder
  problematische Benennungen. Dieser Selbstlernkurs führt anhand von Beispielen
  in die verschiedenen ethischen Problemfelder ein, die uns bei der
  Sammlungsdigitalisierung begegnen können. Er zeigt Möglichkeiten auf, wie wir
  mit ethischen Herausforderungen umgehen können und verlinkt zu jedem
  Themenbereich weiterführende Ressourcen.  Als Point and Click Adventure nimmt
  er Nutzer*innen spielerisch mit in eine schulgeschichtliche Sammlung, deren
  Objekte digitalisiert werden sollen: Hilf der Sammlungsleiterin Clementine
  dabei, die ethischen Herausforderungen zu meistern! Der Kurs kann jederzeit
  begonnen werden. Viel Spaß!
